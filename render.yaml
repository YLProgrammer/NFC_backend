services:
  - type: web
    name: nfc-tracker-sirene-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SIRENE_CACHE_URL
        sync: false   # ex. https://github.com/<owner>/<repo>/releases/download/sirene-cache/stock_etablissements_slim.parquet
      - key: ALLOWED_ORIGINS
        sync: false   # ex. https://<ton-site>.pages.dev  (ou "*" en attendant)
      - key: SUPABASE_URL
        sync: false   # ex. https://xxxxx.supabase.co (projet gratuit, voir README)
      - key: SUPABASE_KEY
        sync: false   # clé "service_role" du projet Supabase (jamais exposée au front)
